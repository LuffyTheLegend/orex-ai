<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8ad2ff"/>
      <stop offset="0.55" stop-color="#2f9bff"/>
      <stop offset="1" stop-color="#0062b8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.51" stop-color="#00131f" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#00131f" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="bubbleShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf5ff"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="100" cy="100" r="96"/>
    </clipPath>
    <radialGradient id="dotGlow" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#3fa9ff"/>
      <stop offset="1" stop-color="#0068c9"/>
    </radialGradient>
  </defs>

  <!-- backdrop -->
  <circle cx="100" cy="100" r="96" fill="url(#bg)"/>

  <!-- soft ground shadow under the bubble for depth -->
  <ellipse cx="100" cy="126" rx="46" ry="8" fill="#00131f" opacity="0.14"/>

  <!-- message bubble -->
  <rect x="50" y="56" width="100" height="64" rx="24" fill="url(#bubbleShade)"/>
  <path d="M72 118 L72 138 L94 118 Z" fill="#eaf5ff"/>

  <!-- typing dots -->
  <circle cx="79" cy="88" r="7" fill="url(#dotGlow)"/>
  <circle cx="100" cy="88" r="7" fill="url(#dotGlow)"/>
  <circle cx="121" cy="88" r="7" fill="url(#dotGlow)"/>

  <!-- glass sheen overlay (Frutiger Aero highlight, clipped to the circle) -->
  <circle cx="100" cy="100" r="96" fill="url(#sheen)" clip-path="url(#circleClip)"/>

  <!-- rim light -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5"/>
</svg>
